<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Vinyl Cushion Leather Gradient -->
    <linearGradient id="vinylBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="30%" stop-color="#181c22"/>
      <stop offset="70%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#1e222a"/>
    </linearGradient>
    <linearGradient id="frameRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <pattern id="carbonVinyl" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#222b35"/>
      <rect x="3" y="3" width="3" height="3" fill="#222b35"/>
    </pattern>
    <filter id="benchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#benchShadow)">
    <!-- Welded Steel Frame Backbone (Diagonal Z chassis spine) -->
    <path d="M 45 60 L 160 160 L 260 250" stroke="#37474f" stroke-width="22" stroke-linecap="round"/>
    <path d="M 45 60 L 160 160 L 260 250" stroke="url(#frameRed)" stroke-width="8" stroke-linecap="round"/>

    <!-- Incline Angle Selector Pin Quadrant (Pivot Arc) -->
    <path d="M 125 180 A 45 45 0 0 0 175 145" fill="none" stroke="#ffd700" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="160" r="10" fill="#212121" stroke="#ffffff" stroke-width="2"/>
    <circle cx="150" cy="160" r="4" fill="#ff1744"/>

    <!-- Transport Roller Wheels at Base -->
    <circle cx="265" cy="255" r="14" fill="#111111" stroke="#ff1744" stroke-width="3"/>
    <circle cx="265" cy="255" r="5" fill="#cfd8dc"/>

    <!-- Floor Stabilizer Foot Footpad at Front -->
    <rect x="25" y="240" width="70" height="20" rx="4" fill="#111" stroke="#ff1744" stroke-width="2"/>

    <!-- TOP INCLINE BACKREST PAD (Occupies upper half of Z shape: x: 30 to 180, y: 25 to 110) -->
    <g transform="rotate(-20 100 70)">
      <!-- Cushion Base -->
      <rect x="25" y="45" width="165" height="55" rx="10" fill="url(#vinylBlack)" stroke="#ff1744" stroke-width="2.5"/>
      <rect x="25" y="45" width="165" height="55" rx="10" fill="url(#carbonVinyl)" opacity="0.4"/>
      <!-- Double Racing-Red Perimeter Stitching -->
      <rect x="32" y="52" width="151" height="41" rx="6" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Stepp Embroidered Emblem on Headrest -->
      <text x="145" y="76" font-family="'Impact', Arial" font-size="14" fill="#ffffff" letter-spacing="1">STEPP</text>
    </g>

    <!-- BOTTOM SEAT CUSHION PAD (Occupies lower half: x: 120 to 260, y: 150 to 225) -->
    <g>
      <rect x="125" y="150" width="135" height="52" rx="10" fill="url(#vinylBlack)" stroke="#ff1744" stroke-width="2.5"/>
      <rect x="125" y="150" width="135" height="52" rx="10" fill="url(#carbonVinyl)" opacity="0.4"/>
      <rect x="132" y="157" width="121" height="38" rx="6" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>
  </g>
</svg>

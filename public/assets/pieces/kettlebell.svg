<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Cast Iron Bell Radial Gradient -->
    <radialGradient id="ironSphere" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#997300"/>
      <stop offset="90%" stop-color="#473600"/>
      <stop offset="100%" stop-color="#1f1800"/>
    </radialGradient>
    <!-- Iron Handle Gradient -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#705400"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff59d"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#473600"/>
    </linearGradient>
    <filter id="kbShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#kbShadow)">
    <!-- Handle Outer Path -->
    <path d="M 45 115 C 45 40, 60 18, 100 18 C 140 18, 155 40, 155 115 C 138 115, 134 65, 100 65 C 66 65, 62 115, 45 115 Z" 
          fill="url(#handleGrad)" stroke="#2b2100" stroke-width="2"/>

    <!-- Handle Top Grip Knurl -->
    <rect x="75" y="19" width="50" height="18" rx="4" fill="#1f1800" opacity="0.3"/>
    <line x1="85" y1="28" x2="115" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>

    <!-- Cast Iron Bell Sphere Body -->
    <ellipse cx="100" cy="125" rx="66" ry="62" fill="url(#ironSphere)" stroke="#2b2100" stroke-width="2"/>

    <!-- Flat Ground Base Rim -->
    <ellipse cx="100" cy="180" rx="34" ry="5" fill="#1f1800" opacity="0.7"/>

    <!-- Stamped Badge / Stepp Fitness Logo Accent -->
    <circle cx="100" cy="122" r="26" fill="#1a1400" stroke="#ffd700" stroke-width="1.5"/>
    <text x="100" y="117" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">32 KG</text>
    <text x="100" y="132" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#ffd700" text-anchor="middle" letter-spacing="1.5">STEPP</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="treadBelt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="consoleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82b1ff"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <pattern id="beltTread" width="12" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="12" y2="4" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <filter id="tmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#tmShadow)">
    <!-- Main Running Deck (Horizontal Base: x: 20 to 280, y: 220 to 275) -->
    <!-- Steel Deck Frame Chassis -->
    <rect x="25" y="225" width="250" height="42" rx="8" fill="#1b222d" stroke="#2979ff" stroke-width="2"/>
    <!-- Yellow Side Non-Slip Foot Rails -->
    <rect x="30" y="228" width="240" height="7" rx="2" fill="#ffd600"/>
    <rect x="30" y="256" width="240" height="7" rx="2" fill="#ffd600"/>
    <!-- Center Running Belt -->
    <rect x="40" y="235" width="220" height="21" rx="3" fill="url(#treadBelt)"/>
    <rect x="40" y="235" width="220" height="21" fill="url(#beltTread)"/>
    <!-- Rear Roller Bearing End Caps -->
    <ellipse cx="265" cy="246" rx="8" ry="14" fill="#82b1ff" stroke="#0d47a1" stroke-width="2"/>
    <ellipse cx="35" cy="246" rx="8" ry="14" fill="#424242"/>

    <!-- Front Motor Hood (x: 25 to 85) -->
    <path d="M 25 240 Q 30 205, 75 205 L 85 240 Z" fill="#242c38" stroke="#2979ff" stroke-width="2"/>

    <!-- Upright Console Mast rising up (Vertical: x: 45 to 80, y: 35 to 220) -->
    <path d="M 52 215 L 48 80 L 76 80 L 76 215 Z" fill="url(#consoleBlue)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Ergonomic Handrails -->
    <path d="M 55 90 C 85 85, 130 95, 140 125" fill="none" stroke="#2979ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 55 90 C 85 85, 130 95, 140 125" fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>

    <!-- Angled Digital LED Display Console at Top (x: 30 to 110, y: 25 to 85) -->
    <rect x="32" y="25" width="80" height="60" rx="8" fill="#090d14" stroke="#82b1ff" stroke-width="2.5"/>
    <!-- Screen Bezel -->
    <rect x="40" y="32" width="64" height="42" rx="4" fill="#000000" stroke="#2979ff" stroke-width="1"/>
    <!-- LED Digital Readouts -->
    <text x="72" y="47" font-family="'Impact', Arial" font-size="11" fill="#00e5ff" text-anchor="middle">10.5 MPH</text>
    <text x="72" y="60" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#ffd700" text-anchor="middle">INC 12% • STEPP</text>
    <!-- Emergency Stop Safety Lanyard Button -->
    <circle cx="72" cy="78" r="4.5" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>

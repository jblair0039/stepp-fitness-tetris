<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="rackSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="30%" stop-color="#212121"/>
      <stop offset="70%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="safetyRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffab40"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <filter id="rackShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#rackShadow)">
    <!-- Base Plate Footing (Horizontal spanning x: 80 to 280, y: 240 to 280) -->
    <rect x="80" y="250" width="200" height="30" rx="6" fill="url(#rackSteel)" stroke="#ff6d00" stroke-width="2"/>
    <!-- Triangular Gusset Support -->
    <polygon points="80,250 145,250 120,200" fill="#212121" stroke="#37474f" stroke-width="2"/>

    <!-- Bright Safety Red Spotter Arm extending along bottom -->
    <rect x="120" y="235" width="155" height="20" rx="4" fill="url(#safetyRed)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="135" y="235" width="125" height="6" fill="#111111" opacity="0.6"/> <!-- rubber pad -->

    <!-- Vertical 3x3 Upright Column (x: 80 to 135, y: 20 to 260) -->
    <rect x="80" y="20" width="55" height="240" rx="6" fill="url(#rackSteel)" stroke="#ff6d00" stroke-width="2.5"/>

    <!-- Laser Cut Numbered Pin Holes on Upright -->
    <!-- 8 pin holes -->
    <g fill="#0c0e12" stroke="#455a64" stroke-width="1.5">
      <circle cx="107" cy="45" r="7"/>
      <circle cx="107" cy="72" r="7"/>
      <circle cx="107" cy="99" r="7"/>
      <circle cx="107" cy="126" r="7"/>
      <circle cx="107" cy="153" r="7"/>
      <circle cx="107" cy="180" r="7"/>
      <circle cx="107" cy="207" r="7"/>
    </g>

    <!-- Number labels beside pin holes -->
    <g font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#ffab40" text-anchor="middle">
      <text x="92" y="48">1</text>
      <text x="92" y="75">2</text>
      <text x="92" y="102">3</text>
      <text x="92" y="129">4</text>
      <text x="92" y="156">5</text>
      <text x="92" y="183">6</text>
      <text x="92" y="210">7</text>
    </g>

    <!-- Chrome Heavy-Duty J-Cup Hook mounted on hole 3 -->
    <rect x="100" y="94" width="38" height="18" rx="3" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
    <rect x="126" y="85" width="12" height="27" rx="3" fill="#ff6d00" stroke="#fff" stroke-width="1.5"/>

    <!-- Stepp Laser Badge near top -->
    <text x="107" y="32" font-family="'Impact', Arial" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">STEPP</text>
  </g>
</svg>

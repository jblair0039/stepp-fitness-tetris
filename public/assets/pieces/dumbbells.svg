<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Rubber Hex Texture Gradient -->
    <linearGradient id="rubberHex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="40%" stop-color="#141c21"/>
      <stop offset="80%" stop-color="#0a0e11"/>
      <stop offset="100%" stop-color="#1f292e"/>
    </linearGradient>
    <!-- Chrome Handle Gradient -->
    <linearGradient id="dbChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfd8dc"/>
      <stop offset="70%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="dbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- S-Shape Configuration: Top-right dumbbell and Bottom-left dumbbell joined by chrome knurled bar -->
  <g filter="url(#dbShadow)">
    <!-- Contoured Chrome Knurled Handle linking the dumbbells across S shape -->
    <path d="M 85 215 C 130 180, 170 120, 215 85" fill="none" stroke="url(#dbChrome)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 85 215 C 130 180, 170 120, 215 85" fill="none" stroke="#212121" stroke-width="18" stroke-dasharray="3 3" opacity="0.4"/>
    <path d="M 85 215 C 130 180, 170 120, 215 85" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- TOP-RIGHT HEX HEAD -->
    <g transform="translate(195, 45)">
      <!-- Outer Hexagon -->
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="url(#rubberHex)" stroke="#00e676" stroke-width="3"/>
      <!-- Inner Bevel Hexagon -->
      <polygon points="45,16 76,34 76,70 45,88 14,70 14,34" fill="#0d1317" stroke="#37474f" stroke-width="1.5"/>
      <!-- Embossed Weight Text -->
      <text x="45" y="56" font-family="'Impact', Arial" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">50</text>
      <text x="45" y="70" font-family="Arial" font-weight="900" font-size="9" fill="#00e676" text-anchor="middle">LB</text>
    </g>

    <!-- BOTTOM-LEFT HEX HEAD -->
    <g transform="translate(15, 155)">
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="url(#rubberHex)" stroke="#00e676" stroke-width="3"/>
      <polygon points="45,16 76,34 76,70 45,88 14,70 14,34" fill="#0d1317" stroke="#37474f" stroke-width="1.5"/>
      <text x="45" y="56" font-family="'Impact', Arial" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">50</text>
      <text x="45" y="70" font-family="Arial" font-weight="900" font-size="9" fill="#00e676" text-anchor="middle">LB</text>
    </g>

    <!-- Center Accent Dumbbell Head in middle of S curve -->
    <g transform="translate(105, 100)">
      <polygon points="45,5 85,28 85,72 45,95 5,72 5,28" fill="url(#rubberHex)" stroke="#00e676" stroke-width="2.5"/>
      <circle cx="45" cy="50" r="18" fill="#141c21" stroke="#00e676" stroke-width="1.5"/>
      <text x="45" y="54" font-family="Arial" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">STEPP</text>
    </g>
  </g>
</svg>
